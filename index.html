<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>iPad 交通天氣儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 頂部：時鐘與天氣 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1E293B;
      padding: 16px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }
    .clock-box { display: flex; flex-direction: column; }
    .time { font-size: 3.8rem; font-weight: 700; color: #38BDF8; line-height: 1; letter-spacing: -1px; }
    .date { font-size: 1.1rem; color: #94A3B8; margin-top: 6px; }
    
    .weather-box { display: flex; align-items: center; gap: 16px; }
    .temp-main { font-size: 3.2rem; font-weight: 700; color: #F1F5F9; }
    .weather-info { font-size: 1rem; color: #CBD5E1; display: flex; flex-direction: column; gap: 2px; }
    .humidity { color: #38BDF8; }

    /* 狀態提示列 */
    .status-bar {
      margin-top: 10px;
      background: #0284C7;
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    /* 控制列 */
    .control-bar {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .section-title { font-size: 1.1rem; color: #94A3B8; font-weight: 600; }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    /* 到站時間卡片區 */
    .grid-container {
      flex: 1;
      overflow-y: auto;
      margin-top: 10px;
      padding-right: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: #1E293B;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid #EF4444; /* 九巴紅 */
    }

    .route-header { display: flex; align-items: center; gap: 8px; }
    .route-number { font-size: 1.8rem; font-weight: 800; color: #F8FAFC; }
    .stop-badge { 
      background: #334155; 
      color: #38BDF8; 
      font-size: 0.75rem; 
      padding: 2px 6px; 
      border-radius: 4px; 
      font-weight: 600;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-dest { font-size: 0.95rem; color: #94A3B8; margin-top: 2px; }
    
    .eta-box { text-align: right; }
    .eta-main { font-size: 1.8rem; font-weight: 700; color: #10B981; }
    .eta-sub { font-size: 0.8rem; color: #64748B; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- 頂部資訊列 -->
  <div class="header">
    <div class="clock-box">
      <div class="time" id="clock">00:00</div>
      <div class="date" id="date">載入中...</div>
    </div>
    <div class="weather-box">
      <div class="temp-main" id="temp">--°C</div>
      <div class="weather-info">
        <span id="weather-desc">香港天文台</span>
        <span class="humidity">濕度: <span id="humidity">--</span>%</span>
      </div>
    </div>
  </div>

  <!-- 系統狀態列 -->
  <div class="status-bar" id="status-bar">
    <span id="status-msg">🚀 初始化系統中...</span>
  </div>

  <!-- 控制列 -->
  <div class="control-bar">
    <div class="section-title">🚌 錦泰苑 / 富安花園 實時到站</div>
    <button class="btn" onclick="forceReloadStops()">↺ 強制重新載入</button>
  </div>

  <!-- 到站時間列表 -->
  <div class="grid-container">
    <div class="grid" id="eta-container">
      <div style="color: #94A3B8; grid-column: span 2; text-align: center; padding: 40px;">正在讀取巴士到站時間，請稍候...</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'kmb_stops_kamtai_chevalier_v6';
    // 指定目標：錦泰苑與富安花園，明確排除德信中學
    const TARGET_KEYWORDS = ["錦泰苑", "富安花園"];
    const EXCLUDE_KEYWORDS = ["德信中學"];
    
    let targetStopsList = [];

    function setStatus(msg, isError = false) {
      const bar = document.getElementById('status-bar');
      const text = document.getElementById('status-msg');
      text.innerText = msg;
      bar.style.background = isError ? '#991B1B' : '#0284C7';
    }

    // 1. 時鐘
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 天氣 API
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        if (data.temperature?.data?.length > 0) document.getElementById('temp').innerText = `${data.temperature.data[0].value}°C`;
        if (data.humidity?.data?.length > 0) document.getElementById('humidity').innerText = data.humidity.data[0].value;
      } catch (err) { console.error('天氣載入失敗', err); }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    // 3. 自動搜尋並對應錦泰苑及富安花園的所有站位 ID
    async function loadTargetStops() {
      // 清理歷史舊 Version Key
      ['myKmbStops_v1','myKmbStops_v2','myKmbStops_v3','myKmbStops_v4','kmb_stops_ma_v5'].forEach(k => localStorage.removeItem(k));

      try {
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
          targetStopsList = JSON.parse(cached);
          if (targetStopsList.length > 0) {
            setStatus(`已鎖定 ${targetStopsList.length} 個「錦泰苑/富安花園」站點，載入班次中...`);
            fetchETAs();
            return;
          }
        }
      } catch(e) {}

      setStatus('正在連線九巴 API 獲取「錦泰苑」與「富安花園」所有站位...');
      try {
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        if (!res.ok) throw new Error('網絡連線失敗');

        const json = await res.json();
        const allStops = json.data || [];

        // 包含錦泰苑/富安花園，並排除德信中學
        const matched = allStops.filter(s => {
          if (!s.name_tc) return false;
          const isTarget = TARGET_KEYWORDS.some(kw => s.name_tc.includes(kw));
          const isExcluded = EXCLUDE_KEYWORDS.some(kw => s.name_tc.includes(kw));
          return isTarget && !isExcluded;
        });

        if (matched.length > 0) {
          targetStopsList = matched.map(s => ({ id: s.stop, name: s.name_tc }));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(targetStopsList));
          setStatus(`成功自動識別 ${targetStopsList.length} 個站點！載入班次中...`);
          fetchETAs();
        } else {
          setStatus('未找到相關站點，請點擊「強制重新載入」。', true);
        }
      } catch (err) {
        setStatus(`資料讀取失敗：${err.message}，請檢查網絡環境`, true);
      }
    }

    function forceReloadStops() {
      localStorage.removeItem(STORAGE_KEY);
      targetStopsList = [];
      loadTargetStops();
    }

    // 4. 抓取到站時間 (ETA)
    async function fetchETAs() {
      const container = document.getElementById('eta-container');

      if (!targetStopsList || targetStopsList.length === 0) {
        container.innerHTML = `<div style="color: #94A3B8; grid-column: span 2; text-align: center; padding: 40px; background: #1E293B; border-radius: 12px;">尚未取得車站數據，請點擊右上方「強制重新載入」。</div>`;
        return;
      }

      try {
        const requests = targetStopsList.map(stop => 
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.id}`)
            .then(res => res.json())
            .then(json => ({ stopName: stop.name, data: json.data || [] }))
            .catch(() => ({ stopName: stop.name, data: [] }))
        );

        const results = await Promise.all(requests);
        const routeMap = {};

        results.forEach(res => {
          if (!Array.isArray(res.data)) return;

          res.data.forEach(item => {
            if (!item || !item.eta || !item.route) return;

            // 以「路線_目的地_站名」作為獨立鍵，確保不同方向與站位分開顯示
            const key = `${item.route}_${item.dest_tc}_${res.stopName}`;
            if (!routeMap[key]) {
              routeMap[key] = {
                route: item.route,
                dest: item.dest_tc,
                stopName: res.stopName,
                etas: []
              };
            }
            if (!routeMap[key].etas.includes(item.eta)) {
              routeMap[key].etas.push(item.eta);
            }
          });
        });

        const keys = Object.keys(routeMap);
        if (keys.length === 0) {
          container.innerHTML = `<div style="color: #94A3B8; grid-column: span 2; text-align: center; padding: 30px; background: #1E293B; border-radius: 12px;">目前無實時班次數據（可能非服務時間）</div>`;
          setStatus(`已連線，目前無班次數據 (${new Date().toLocaleTimeString('zh-HK')})`);
          return;
        }

        // 依路線號碼自然排序（如 43X, 81C, 85K, 89C, 289K, 680...）
        keys.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

        let html = '';
        keys.forEach(key => {
          const info = routeMap[key];
          info.etas.sort((a, b) => new Date(a) - new Date(b));

          const eta1 = calcMin(info.etas[0]);
          const eta2 = info.etas[1] ? `下班: ${calcMin(info.etas[1])}` : '';

          html += `
            <div class="card">
              <div>
                <div class="route-header">
                  <span class="route-number">${info.route}</span>
                  <span class="stop-badge">${info.stopName}</span>
                </div>
                <div class="route-dest">往 ${info.dest}</div>
              </div>
              <div class="eta-box">
                <div class="eta-main">${eta1}</div>
                <div class="eta-sub">${eta2}</div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
        setStatus(`最後更新：${new Date().toLocaleTimeString('zh-HK')} - 共 ${keys.length} 項到站預告`);

      } catch (e) {
        setStatus(`更新班次失敗：${e.message}`, true);
      }
    }

    function calcMin(etaStr) {
      if (!etaStr) return '無班次';
      const diffMs = new Date(etaStr) - new Date();
      const diffMins = Math.round(diffMs / 60000);
      if (diffMins <= 0) return '即將到達';
      return `${diffMins} 分鐘`;
    }

    // 啟動系統
    loadTargetStops();
    setInterval(fetchETAs, 30000); // 每 30 秒自動刷新
  </script>
</body>
</html>
