<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iPad 交通天氣儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 頂部：時鐘與天氣 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1E293B;
      padding: 16px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }
    .clock-box { display: flex; flex-direction: column; }
    .time { font-size: 4.2rem; font-weight: 700; color: #38BDF8; line-height: 1; letter-spacing: -1px; }
    .date { font-size: 1.2rem; color: #94A3B8; margin-top: 6px; }
    
    .weather-box { display: flex; align-items: center; gap: 20px; }
    .temp-main { font-size: 3.5rem; font-weight: 700; color: #F1F5F9; }
    .weather-info { font-size: 1.1rem; color: #CBD5E1; display: flex; flex-direction: column; gap: 4px; }
    .humidity { color: #38BDF8; }

    /* 控制列 */
    .control-bar {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0F172A;
      padding: 4px 0;
      flex-shrink: 0;
    }
    .section-title { font-size: 1.2rem; color: #94A3B8; font-weight: 600; }
    .btn-settings {
      background: #0284C7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }

    /* 下方：到站時間資訊區 */
    .grid-container {
      flex: 1;
      overflow-y: auto;
      margin-top: 8px;
      padding-right: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: #1E293B;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 6px solid #EF4444; /* 九巴紅 */
    }

    .route-header { display: flex; align-items: center; gap: 8px; }
    .route-number { font-size: 2rem; font-weight: 800; color: #F8FAFC; }
    .stop-badge { 
      background: #334155; 
      color: #38BDF8; 
      font-size: 0.8rem; 
      padding: 2px 8px; 
      border-radius: 6px; 
      font-weight: 600;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-dest { font-size: 1rem; color: #94A3B8; margin-top: 2px; }
    
    .eta-box { text-align: right; }
    .eta-main { font-size: 2rem; font-weight: 700; color: #10B981; }
    .eta-sub { font-size: 0.85rem; color: #64748B; margin-top: 2px; }

    /* 彈出式搜尋視窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: #1E293B;
      width: 90%;
      max-width: 500px;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 80vh;
    }
    .modal-title { font-size: 1.3rem; font-weight: 700; color: white; }
    .search-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0F172A;
      color: white;
      font-size: 1rem;
    }
    .search-results {
      flex: 1;
      overflow-y: auto;
      max-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .result-item {
      background: #334155;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .selected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .tag {
      background: #0284C7;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag span { cursor: pointer; font-weight: bold; }
    .btn-close {
      background: #10B981;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部資訊列 -->
  <div class="header">
    <div class="clock-box">
      <div class="time" id="clock">00:00</div>
      <div class="date" id="date">加載中...</div>
    </div>
    <div class="weather-box">
      <div class="temp-main" id="temp">--°C</div>
      <div class="weather-info">
        <span id="weather-desc">天文台數據</span>
        <span class="humidity">濕度: <span id="humidity">--</span>%</span>
      </div>
    </div>
  </div>

  <!-- 控制列 -->
  <div class="control-bar">
    <div class="section-title">🚌 巴士實時到站（預設 MA131, 354, 358, 391, 392）</div>
    <button class="btn-settings" onclick="openModal()">🔍 管理/新增車站</button>
  </div>

  <!-- 到站時間列表 -->
  <div class="grid-container">
    <div class="grid" id="eta-container">
      <div style="color: #94A3B8; grid-column: span 2; text-align: center; padding: 40px;">巴士數據載入中...</div>
    </div>
  </div>

  <!-- 車站搜尋 Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title">搜尋車站</div>
      <input type="text" class="search-input" id="search-input" placeholder="輸入關鍵字搜尋..." oninput="searchStops()">
      <div class="search-results" id="search-results">
        <div style="color: #94A3B8; text-align: center; padding: 10px;">請在上方輸入車站關鍵字</div>
      </div>
      <div>
        <div style="font-size: 0.9rem; color: #94A3B8;">目前顯示的車站：</div>
        <div class="selected-list" id="selected-tags"></div>
      </div>
      <button class="btn-close" onclick="closeModal()">儲存並顯示</button>
    </div>
  </div>

  <script>
    let allKmbStops = [];
    
    // 只精確預設你的 5 個指定車站代碼 (MA131, MA354, MA358, MA391, MA392)
    const presetStopCodes = [
      "MA131-S-1000-0",
      "MA354-S-1000-0",
      "MA358-S-1000-0",
      "MA391-S-1000-0",
      "MA392-S-1000-0"
    ];

    let mySavedStops = JSON.parse(localStorage.getItem('myKmbStops_v2')) || [];

    // 1. 時鐘
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 天氣 API
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        if (data.temperature?.data?.length > 0) document.getElementById('temp').innerText = `${data.temperature.data[0].value}°C`;
        if (data.humidity?.data?.length > 0) document.getElementById('humidity').innerText = data.humidity.data[0].value;
      } catch (err) { console.error('天氣加載失敗', err); }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    // 3. 下載車站列表並載入指定 5 個預設站點
    async function initKmbStops() {
      try {
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const json = await res.json();
        allKmbStops = json.data || [];

        // 首次使用時，自動匹配該 5 個特定車站 ID
        if (mySavedStops.length === 0 && allKmbStops.length > 0) {
          presetStopCodes.forEach(code => {
            const found = allKmbStops.find(stop => stop.stop === code);
            if (found) {
              mySavedStops.push({ id: found.stop, name: found.name_tc });
            }
          });
          localStorage.setItem('myKmbStops_v2', JSON.stringify(mySavedStops));
        }

        fetchAllETAs();
      } catch (e) {
        console.error('車站名單載入失敗', e);
      }
    }

    // 4. 車站搜尋與切換
    function searchStops() {
      const query = document.getElementById('search-input').value.trim();
      const resultsContainer = document.getElementById('search-results');
      if (!query) {
        resultsContainer.innerHTML = '<div style="color: #94A3B8; text-align: center; padding: 10px;">請在上方輸入車站關鍵字</div>';
        return;
      }

      const matched = allKmbStops.filter(stop => stop.name_tc.includes(query)).slice(0, 20);
      
      if (matched.length === 0) {
        resultsContainer.innerHTML = '<div style="color: #94A3B8; text-align: center; padding: 10px;">找不到相關車站</div>';
        return;
      }

      resultsContainer.innerHTML = matched.map(stop => `
        <div class="result-item" onclick="addStop('${stop.stop}', '${stop.name_tc}')">
          <span>${stop.name_tc}</span>
          <span style="color: #38BDF8; font-weight: bold;">+ 加入</span>
        </div>
      `).join('');
    }

    function addStop(id, name) {
      if (!mySavedStops.some(s => s.id === id)) {
        mySavedStops.push({ id, name });
        renderTags();
      }
    }

    function removeStop(id) {
      mySavedStops = mySavedStops.filter(s => s.id !== id);
      renderTags();
    }

    function renderTags() {
      const container = document.getElementById('selected-tags');
      container.innerHTML = mySavedStops.map(s => `
        <div class="tag">
          ${s.name} <span onclick="removeStop('${s.id}')">✕</span>
        </div>
      `).join('');
    }

    function openModal() {
      renderTags();
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      localStorage.setItem('myKmbStops_v2', JSON.stringify(mySavedStops));
      fetchAllETAs();
    }

    // 5. 抓取實時到站時間
    async function fetchAllETAs() {
      const container = document.getElementById('eta-container');
      
      if (!mySavedStops || mySavedStops.length === 0) {
        container.innerHTML = `
          <div style="color: #94A3B8; grid-column: span 2; text-align: center; padding: 40px; background: #1E293B; border-radius: 16px;">
            請點擊右上角「🔍 管理/新增車站」選擇車站。
          </div>`;
        return;
      }

      try {
        const requests = mySavedStops.map(stop => 
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.id}`)
            .then(res => res.json())
            .then(json => ({ stopName: stop.name, data: json.data || [] }))
            .catch(() => ({ stopName: stop.name, data: [] }))
        );

        const results = await Promise.all(requests);
        const routeMap = {};

        results.forEach(result => {
          if (!Array.isArray(result.data)) return;

          result.data.forEach(item => {
            if (!item || !item.eta || !item.route) return;

            // 鍵值：路線 + 目的地
            const key = `${item.route}_${item.dest_tc}`;

            if (!routeMap[key]) {
              routeMap[key] = {
                route: item.route,
                dest: item.dest_tc,
                stopName: result.stopName,
                etas: []
              };
            }
            if (!routeMap[key].etas.includes(item.eta)) {
              routeMap[key].etas.push(item.eta);
            }
          });
        });

        const keys = Object.keys(routeMap);
        if (keys.length === 0) {
          container.innerHTML = '<div style="color: #64748B; grid-column: span 2; text-align: center; padding: 30px; background: #1E293B; border-radius: 16px;">目前無實時班次數據</div>';
          return;
        }

        // 按路線名稱排序
        keys.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

        let html = '';
        keys.forEach(key => {
          const info = routeMap[key];
          info.etas.sort((a, b) => new Date(a) - new Date(b));

          const eta1 = calculateMinutes(info.etas[0]);
          const eta2 = info.etas[1] ? `下班: ${calculateMinutes(info.etas[1])}` : '';

          html += `
            <div class="card">
              <div>
                <div class="route-header">
                  <span class="route-number">${info.route}</span>
                  <span class="stop-badge">${info.stopName}</span>
                </div>
                <div class="route-dest">往 ${info.dest}</div>
              </div>
              <div class="eta-box">
                <div class="eta-main">${eta1}</div>
                <div class="eta-sub">${eta2}</div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (e) {
        console.error('更新失敗', e);
        container.innerHTML = '<div style="color: #EF4444; grid-column: span 2; text-align: center; padding: 20px;">數據更新失敗，請檢查網絡連線</div>';
      }
    }

    function calculateMinutes(etaString) {
      if (!etaString) return '無班次';
      const diffMs = new Date(etaString) - new Date();
      const diffMins = Math.round(diffMs / 60000);
      if (diffMins <= 0) return '即將到達';
      return `${diffMins} 分鐘`;
    }

    // 啟動程式
    initKmbStops();
    setInterval(fetchAllETAs, 30000); // 每 30 秒自動更新到站時間
  </script>
</body>
</html>
